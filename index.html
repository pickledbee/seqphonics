/* ============================================================
   NATURAL SPEECH ENGINE (NO API KEYS)
============================================================ */

function useSpeech(text) {
  const synth = window.speechSynthesis;
  const utter = new SpeechSynthesisUtterance(text);

  // Load voices
  let voices = [];
  const loadVoices = () => {
    voices = synth.getVoices();

    // Pick the most human-like voice available
    const preferred = voices.find(v =>
      /Samantha|Daniel|Ava|Zira|Aria|Google US English|Moira|Serena|Tom/i.test(v.name)
    );
    utter.voice = preferred || voices[0];
  };

  loadVoices();
  if (voices.length === 0) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  // Natural-sounding parameters
  utter.pitch = 1.0;
  utter.rate = 0.95;

  return {
    play: () => { synth.cancel(); synth.speak(utter); },
    pause: () => synth.pause(),
    resume: () => synth.resume(),
    stop: () => synth.cancel(),
    changeRate: (r) => utter.rate = r
  };
}

/* ============================================================
   STYLE 3: SPEAKER ICON → EXPANDING PANEL
============================================================ */

function SpeechControls({ text }) {
  const [open, setOpen] = React.useState(false);
  const [rate, setRate] = React.useState(0.95);
  const engine = React.useMemo(() => useSpeech(text), [text]);

  const syncRate = (e) => {
    const value = parseFloat(e.target.value);
    setRate(value);
    engine.changeRate(value);
  };

  if (!open) {
    return (
      <button
        className="text-xl mt-2 text-slate-600 hover:text-slate-800"
        onClick={() => setOpen(true)}
        title="Listen to this section"
      >
        🔈
      </button>
    );
  }

  return (
    <div className="voice-panel bg-white p-4 mt-3 rounded-xl shadow border border-slate-200">
      <div className="font-bold mb-2 text-slate-700">Speech Controls</div>

      <div className="flex gap-3 flex-wrap">
        <button className="bg-sky-500 text-white px-3 py-1 rounded" onClick={engine.play}>Play</button>
        <button className="bg-yellow-500 text-white px-3 py-1 rounded" onClick={engine.pause}>Pause</button>
        <button className="bg-green-500 text-white px-3 py-1 rounded" onClick={engine.resume}>Resume</button>
        <button className="bg-red-500 text-white px-3 py-1 rounded" onClick={engine.stop}>Stop</button>
      </div>

      <div className="mt-4">
        <label className="text-sm font-semibold">Speed: {rate.toFixed(2)}</label>
        <input type="range" min="0.6" max="1.4" step="0.05"
               value={rate}
               onChange={syncRate}
               className="w-full" />
      </div>

      <button
        className="mt-3 text-red-500 font-bold underline"
        onClick={() => setOpen(false)}
      >
        Close
      </button>
    </div>
  );
}

/* ============================================================
   CHATBOT — WITH KNOWLEDGE BASE LOGIC
============================================================ */

function Chatbot() {
  const [open, setOpen] = React.useState(false);
  const [messages, setMessages] = React.useState([
    { sender: "bot", text: "Hello! How can I help you learn about Reading Connections Inc. today?" }
  ]);
  const [input, setInput] = React.useState("");

  const knowledgeBase = (msg) => {
    const t = msg.toLowerCase();

    if (t.includes("hour")) return "We are open Monday through Thursday, from 2:00 PM to 6:00 PM.";
    if (t.includes("contact")) return "You can reach us at (920) 544-5115 or rickb@rcinc.org.";
    if (t.includes("phone")) return "(920) 544-5115.";
    if (t.includes("email")) return "Our email is rickb@rcinc.org.";
    if (t.includes("location") || t.includes("where")) return "We are located at 1260 Centennial Centre Blvd, Suite 200, Hobart, WI 54155.";
    if (t.includes("service")) return "We offer one-on-one instruction including consultations, evaluations, and private lessons.";
    if (t.includes("price")) return "For pricing and scheduling, please contact us directly at (920) 544-5115.";
    if (t.includes("mission")) return "Our mission is to empower readers through a method grounded in brain science.";
    if (t.includes("method")) return "Our method uses Multisensory Learning, Sequential Phonics, Cognitive Reinforcement, and Emotional Transformation.";
    return "I'm here to help with questions about our services, mission, hours, or location!";
  };

  const sendMessage = () => {
    if (!input.trim()) return;
    const userMsg = { sender: "user", text: input };
    setMessages((prev) => [...prev, userMsg]);

    setTimeout(() => {
      const botReply = { sender: "bot", text: knowledgeBase(input) };
      setMessages((prev) => [...prev, botReply]);
    }, 600);

    setInput("");
  };

  return (
    <>
      {!open && (
        <button
          className="fixed bottom-6 right-6 bg-sky-500 text-white p-4 rounded-full shadow-xl"
          onClick={() => setOpen(true)}
        >
          Chat
        </button>
      )}

      {open && (
        <div className="fixed bottom-6 right-6 w-full max-w-sm h-[600px] bg-white rounded-xl shadow-xl flex flex-col">

          {/* Header */}
          <div className="bg-sky-500 text-white p-4 font-bold flex justify-between">
            <span>Reading Connections Chat</span>
            <button onClick={() => setOpen(false)}>X</button>
          </div>

          {/* Messages */}
          <div className="flex-1 p-4 overflow-y-auto bg-slate-50 space-y-4">
            {messages.map((m, i) => (
              <div key={i} className={`flex ${m.sender === "user" ? "justify-end" : "justify-start"}`}>
                <div
                  className={`px-4 py-2 rounded-2xl max-w-xs font-semibold ${
                    m.sender === "user"
                      ? "bg-sky-500 text-white rounded-br-none"
                      : "bg-slate-200 text-slate-800 rounded-bl-none"
                  }`}
                >
                  {m.text}
                </div>
              </div>
            ))}
          </div>

          {/* Input */}
          <div className="p-4 border-t flex gap-2">
            <input
              value={input}
              onChange={(e) => setInput(e.target.value)}
              className="flex-1 border rounded-full px-4 py-2"
              placeholder="Type a message..."
            />
            <button className="bg-sky-500 text-white rounded-full px-4 py-2" onClick={sendMessage}>
              Send
            </button>
          </div>

          {/* Close Chat Button */}
          <button
            className="w-full bg-red-500 text-white py-3 font-bold rounded-b-xl"
            onClick={() => setOpen(false)}
          >
            Close Chat
          </button>
        </div>
      )}
    </>
  );
}
