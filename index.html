    /* ============================================================
       AUDIO (text-to-speech)
    ============================================================ */
    let selectedVoice = null;

    function loadBestVoice() {
      const voices = window.speechSynthesis.getVoices();
      const priority = [
        "Google US English",
        "Google UK English Female",
        "Microsoft Aria Online (Natural)",
        "Microsoft Jenny Online (Natural)"
      ];

      for (const name of priority) {
        const v = voices.find(voice => voice.name === name);
        if (v) { selectedVoice = v; return; }
      }

      // Fallback
      selectedVoice =
        voices.find(v => v.name.includes("Google")) ||
        voices.find(v => v.name.includes("Natural")) ||
        voices[0] || null;
    }

    window.speechSynthesis.onvoiceschanged = loadBestVoice;

    function speakText(text) {
      if (!text) return;

      // Fun pronunciation override
      text = text.replace(/Reading Connections/gi, "Reee-ding Connections");

      const utter = new SpeechSynthesisUtterance(text);
      if (selectedVoice) utter.voice = selectedVoice;
      utter.pitch = 1;
      utter.rate = 0.88;
      utter.volume = 1;

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utter);
    }

    /* ============================================================
       Speak Button Component
    ============================================================ */
    function SpeakButton({ text }) {

    /* ============================================================
       CHATBOT
    ============================================================ */
    function Chatbot() {
      const [open, setOpen] = React.useState(false);
      const [messages, setMessages] = React.useState([
        { sender: "bot", text: "Hello! How can I help you learn about Reading Connections today?" }
      ]);
      const [input, setInput] = React.useState("");

      function getBotReply(msg) {
        const t = msg.toLowerCase();

        if (t.includes("hour") || t.includes("open")) return "We are open Monday–Thursday, 2–6 PM.";
        if (t.includes("phone") || t.includes("contact")) return CONTACT.phone;
        if (t.includes("email")) return CONTACT.email;
        if (t.includes("address") || t.includes("where")) return CONTACT.address;
        if (t.includes("service")) return "We offer evaluations, private lessons, and consultations.";
        if (t.includes("mission")) return "Our mission is to help nearly every person learn to read.";
        if (t.includes("method")) return "We use a multisensory, sequential phonics approach.";

        return "Ask about hours, services, mission, method, or contact info.";
      }

      function sendMessage() {
        if (!input.trim()) return;

        setMessages(m => [...m, { sender: "user", text: input }]);

        setTimeout(() => {
          setMessages(m => [...m, { sender: "bot", text: getBotReply(input) }]);
        }, 500);

        setInput("");
      }

      return (
        <>
          {!open && (
            <button
              onClick={() => setOpen(true)}
              className="fixed bottom-6 right-6 bg-sky-600 text-white p-4 rounded-full shadow-2xl text-xl"
            >
              💬
            </button>
          )}

          {open && (
            <div className="fixed bottom-6 right-6 w-full max-w-sm max-h-[80vh] bg-white rounded-xl shadow-2xl flex flex-col border overflow-hidden">

              <div className="bg-sky-600 text-white p-4 font-bold flex justify-between items-center">
                <span>Reading Connections Chat</span>
                <button
                  onClick={() => setOpen(false)}
                  className="bg-white text-sky-600 px-3 py-1 rounded-md font-bold shadow hover:bg-slate-100"
                >
                  Close
                </button>
              </div>

              <div className="flex-1 p-4 overflow-y-auto bg-slate-50 space-y-4">
                {messages.map((m, i) => (
                  <div key={i} className={"flex " + (m.sender === "user" ? "justify-end" : "justify-start")}>
                    <div
                      className={
                        "px-4 py-2 rounded-2xl max-w-xs font-semibold " +
                        (m.sender === "user"
                          ? "bg-sky-600 text-white rounded-br-none"
                          : "bg-slate-200 text-slate-900 rounded-bl-none")
                      }
                    >
                      {m.text}
                    </div>
                  </div>
                ))}
              </div>

              <div className="p-4 border-t flex gap-2">
                <input
                  className="flex-1 border rounded-full px-4 py-2"
                  value={input}
                  placeholder="Type a message…"
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" ? sendMessage() : null}
                />
                <button
                  onClick={sendMessage}
                  className="bg-sky-600 text-white rounded-full px-4 py-2"
                >
                  Send
                </button>
              </div>

            </div>
          )}
        </>
      );
    }
