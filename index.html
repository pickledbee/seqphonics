    /* ============================================================
       AUDIO (text-to-speech)
    ============================================================ */
    let selectedVoice = null;

    function loadBestVoice() {
      const voices = window.speechSynthesis.getVoices();
      const priority = [
        "Google US English",
        "Google UK English Female",
        "Microsoft Aria Online (Natural)",
        "Microsoft Jenny Online (Natural)"
      ];

      for (const name of priority) {
        const v = voices.find(voice => voice.name === name);
        if (v) { selectedVoice = v; return; }
      }

      // Fallback
      selectedVoice =
        voices.find(v => v.name.includes("Google")) ||
        voices.find(v => v.name.includes("Natural")) ||
        voices[0] || null;
    }

    window.speechSynthesis.onvoiceschanged = loadBestVoice;

    function speakText(text) {
      if (!text) return;

      // Fun pronunciation override
      text = text.replace(/Reading Connections/gi, "Reee-ding Connections");

      const utter = new SpeechSynthesisUtterance(text);
      if (selectedVoice) utter.voice = selectedVoice;
      utter.pitch = 1;
      utter.rate = 0.88;
      utter.volume = 1;

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utter);
    }

    /* ============================================================
       CONTACT FORM (Integrated with Google Apps Script)
    ============================================================ */
    function ContactSection() {
      const [formData, setFormData] = React.useState({ name: "", grade: "", email: "", concern: "" });
      const [status, setStatus] = React.useState("idle"); // idle, submitting, success, error

      const handleChange = (e) => {
        setFormData({ ...formData, [e.target.name]: e.target.value });
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setStatus("submitting");

        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors", // Important for Google Apps Script
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData)
          });

          setStatus("success");
          setFormData({ name: "", grade: "", email: "", concern: "" });
        } catch (error) {
          console.error("Error:", error);
          setStatus("error");
        }
      };

      return (
        <section id="contact-form" className="py-20 bg-sky-50">
          <div className="container mx-auto px-6 max-w-2xl">
            <h2 className="text-3xl font-extrabold text-center text-slate-900 mb-8">
              Get In Touch
            </h2>
            <p className="text-center text-slate-600 mb-8">
              Serving families in Hobart, Green Bay, and surrounding communities.
            </p>

            <div className="bg-white p-8 rounded-2xl shadow-lg">
              {status === "success" ? (
                <div className="text-center py-10">
                  <p className="text-2xl text-green-600 font-bold">Thank you!</p>
                  <p className="text-slate-600 mt-2">We have received your message and will contact you shortly.</p>
                  <button onClick={() => setStatus("idle")} className="mt-6 text-sky-600 underline">Send another</button>
                </div>
              ) : (
                <form onSubmit={handleSubmit} className="space-y-4">
                  <div>
                    <label className="block text-sm font-bold text-slate-700">Parent Name</label>
                    <input required name="name" value={formData.name} onChange={handleChange}
                      className="w-full mt-1 p-3 border rounded-lg focus:ring-2 focus:ring-sky-500 outline-none" placeholder="Jane Doe" />
                  </div>

                  <div>
                    <label className="block text-sm font-bold text-slate-700">Child's Grade</label>
                    <input name="grade" value={formData.grade} onChange={handleChange}
                      className="w-full mt-1 p-3 border rounded-lg focus:ring-2 focus:ring-sky-500 outline-none" placeholder="e.g. 2nd Grade" />
                  </div>

                  <div>
                    <label className="block text-sm font-bold text-slate-700">Email Address</label>
                    <input required type="email" name="email" value={formData.email} onChange={handleChange}
                      className="w-full mt-1 p-3 border rounded-lg focus:ring-2 focus:ring-sky-500 outline-none" placeholder="jane@example.com" />
                  </div>

                  <div>
                    <label className="block text-sm font-bold text-slate-700">Primary Concern</label>
                    <textarea required name="concern" value={formData.concern} onChange={handleChange} rows="3"
                      className="w-full mt-1 p-3 border rounded-lg focus:ring-2 focus:ring-sky-500 outline-none" placeholder="Tell us what your child is struggling with..."></textarea>
                  </div>

                  <button disabled={status === "submitting"} type="submit"
                    className="w-full py-3 bg-sky-600 text-white font-bold rounded-lg hover:bg-sky-700 transition disabled:opacity-50">
                    {status === "submitting" ? "Sending..." : "Send Message"}
                  </button>

                  {status === "error" && <p className="text-red-500 text-center text-sm">Something went wrong. Please try again or call us.</p>}
                </form>
              )}
            </div>
          </div>
        </section>
      );
    }

    /* ============================================================
       CHATBOT
    ============================================================ */
    function Chatbot() {
      const [open, setOpen] = React.useState(false);
      const [messages, setMessages] = React.useState([
        { sender: "bot", text: "Hello! How can I help you learn about Reading Connections today?" }
      ]);
      const [input, setInput] = React.useState("");

      function getBotReply(msg) {
        const t = msg.toLowerCase();
        if (t.includes("hour") || t.includes("open")) return "We are open Monday–Thursday, 2–6 PM.";
        if (t.includes("phone") || t.includes("contact")) return CONTACT.phone;
        if (t.includes("email")) return CONTACT.email;
        if (t.includes("address") || t.includes("where")) return CONTACT.address;
        if (t.includes("service")) return "We offer evaluations, private lessons, and consultations.";
        if (t.includes("mission")) return "Our mission is to help nearly every person learn to read.";
        if (t.includes("method")) return "We use a multisensory, sequential phonics approach.";
        return "Ask about hours, services, mission, method, or contact info.";
      }

      function sendMessage() {
        if (!input.trim()) return;
        setMessages(m => [...m, { sender: "user", text: input }]);
        setTimeout(() => {
          setMessages(m => [...m, { sender: "bot", text: getBotReply(input) }]);
        }, 500);
        setInput("");
      }

      return (
        <>
          {!open && (
            <button onClick={() => setOpen(true)} className="fixed bottom-6 right-6 bg-sky-600 text-white p-4 rounded-full shadow-2xl text-2xl z-50 hover:scale-105 transition">
              💬
            </button>
          )}

          {open && (
            <div className="fixed bottom-6 right-6 w-full max-w-sm h-96 bg-white rounded-xl shadow-2xl flex flex-col border overflow-hidden z-50">
              <div className="bg-sky-600 text-white p-4 font-bold flex justify-between items-center">
                <span>Reading Connections Chat</span>
                <button onClick={() => setOpen(false)} className="text-white hover:text-slate-200">✕</button>
              </div>
              <div className="flex-1 p-4 overflow-y-auto bg-slate-50 space-y-3">
                {messages.map((m, i) => (
                  <div key={i} className={`flex ${m.sender === "user" ? "justify-end" : "justify-start"}`}>
                    <div className={`px-4 py-2 rounded-lg max-w-[80%] text-sm ${m.sender === "user" ? "bg-sky-600 text-white" : "bg-slate-200 text-slate-800"}`}>
                      {m.text}
                    </div>
                  </div>
                ))}
              </div>
              <div className="p-3 border-t flex gap-2">
                <input className="flex-1 border rounded-full px-4 py-2 text-sm outline-none focus:border-sky-500"
                  value={input} placeholder="Type a message..." onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" ? sendMessage() : null} />
                <button onClick={sendMessage} className="bg-sky-600 text-white rounded-full px-4 py-2 text-sm font-bold">Send</button>
              </div>
            </div>
          )}
        </>
      );
    }

    /* ============================================================

    ============================================================ */
    let selectedVoice = null;

    function loadBestVoice() {
      const voices = window.speechSynthesis.getVoices();
      const priority = [
        "Google US English",
        "Google UK English Female",
        "Microsoft Aria Online (Natural)",
        "Microsoft Jenny Online (Natural)"
      ];

      for (const name of priority) {
        const v = voices.find(voice => voice.name === name);
        if (v) { selectedVoice = v; return; }
      }

      // Fallback
      selectedVoice =
        voices.find(v => v.name.includes("Google")) ||
        voices.find(v => v.name.includes("Natural")) ||
        voices[0] || null;
    }

    window.speechSynthesis.onvoiceschanged = loadBestVoice;

    function speakText(text) {
      if (!text) return;

      // Fun pronunciation override
      text = text.replace(/Reading Connections/gi, "Reee-ding Connections");

      const utter = new SpeechSynthesisUtterance(text);
      if (selectedVoice) utter.voice = selectedVoice;
      utter.pitch = 1;
      utter.rate = 0.88;
      utter.volume = 1;

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utter);
    }

    /* ============================================================

      const clean = text.replace(/Reading Connections/gi, "Reee-ding Connections");

    /* ============================================================

    ============================================================ */
    function Chatbot() {
      const [open, setOpen] = React.useState(false);
      const [messages, setMessages] = React.useState([
        { sender: "bot", text: "Hello! How can I help you learn about Reading Connections today?" }
      ]);
      const [input, setInput] = React.useState("");

      function getBotReply(msg) {
        const t = msg.toLowerCase();

        if (t.includes("hour") || t.includes("open")) return "We are open Monday–Thursday, 2–6 PM.";
        if (t.includes("phone") || t.includes("contact")) return CONTACT.phone;
        if (t.includes("email")) return CONTACT.email;
        if (t.includes("address") || t.includes("where")) return CONTACT.address;
        if (t.includes("service")) return "We offer evaluations, private lessons, and consultations.";
        if (t.includes("mission")) return "Our mission is to help nearly every person learn to read.";
        if (t.includes("method")) return "We use a multisensory, sequential phonics approach.";

        return "Ask about hours, services, mission, method, or contact info.";
      }

      function sendMessage() {
        if (!input.trim()) return;

        setMessages(m => [...m, { sender: "user", text: input }]);

        setTimeout(() => {
          setMessages(m => [...m, { sender: "bot", text: getBotReply(input) }]);
        }, 500);

        setInput("");
      }

      return (
        <>
          {!open && (
            <button
              onClick={() => setOpen(true)}
              className="fixed bottom-6 right-6 bg-sky-600 text-white p-4 rounded-full shadow-2xl text-xl"

              <div className="bg-sky-600 text-white p-4 font-bold flex justify-between items-center">

                  onClick={() => setOpen(false)}
                  className="bg-white text-sky-600 px-3 py-1 rounded-md font-bold shadow hover:bg-slate-100"
                >
                  Close
                </button>
              </div>

              <div className="flex-1 p-4 overflow-y-auto bg-slate-50 space-y-4">
                {messages.map((m, i) => (
                  <div key={i} className={"flex " + (m.sender === "user" ? "justify-end" : "justify-start")}>
                    <div
                      className={
                        "px-4 py-2 rounded-2xl max-w-xs font-semibold " +
                        (m.sender === "user"
                          ? "bg-sky-600 text-white rounded-br-none"
                          : "bg-slate-200 text-slate-900 rounded-bl-none")
                      }
                    >
                      {m.text}
                    </div>
                  </div>
                ))}
              </div>

              <div className="p-4 border-t flex gap-2">
                <input
                  className="flex-1 border rounded-full px-4 py-2"
                  value={input}
                  placeholder="Type a message…"
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" ? sendMessage() : null}
                />
                <button
                  onClick={sendMessage}
                  className="bg-sky-600 text-white rounded-full px-4 py-2"
                >
                  Send
                </button>
              </div>

            </div>
          )}
        </>
      );
    }
