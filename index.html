/* ============================================================
   AUDIO SYSTEM (Browser-native, human-like voices)
============================================================ */
let selectedVoice = null;

function loadBestVoice() {
  const voices = window.speechSynthesis.getVoices();

  // Try the clearest voices first (Chrome/Edge)
  const priorityVoices = [
    "Google US English",
    "Google UK English Female",
    "Microsoft Aria Online (Natural)",
    "Microsoft Jenny Online (Natural)"
  ];

  // Find the first matching installed voice
  for (const name of priorityVoices) {
    const voice = voices.find(v => v.name === name);
    if (voice) {
      selectedVoice = voice;
      console.log("Selected voice:", voice.name);
      return;
    }
  }

  // Fallback: Anything with Google/Natural
  selectedVoice =
    voices.find(v => v.name.includes("Google")) ||
    voices.find(v => v.name.includes("Natural")) ||
    voices[0] ||
    null;

  console.log("Using fallback voice:", selectedVoice?.name);
}


window.speechSynthesis.onvoiceschanged = loadBestVoice;

/* ============================================================
   Improved TTS Voice — slower, clearer, long E for Reading
============================================================ */
function speakText(text) {
  if (!text) return;

  // Pronunciation override for the entire website
  text = text.replace(/Reading Connections/gi, "Reee-ding Connections");

  const utter = new SpeechSynthesisUtterance(text);

  if (selectedVoice) utter.voice = selectedVoice;

  utter.pitch = 1;
  utter.rate = 0.88;   // MUCH clearer, slower
  utter.volume = 1;

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
}

/* ============================================================

/* ============================================================
   CHATBOT (Text-only, no API)
============================================================ */
function Chatbot() {
  const [open, setOpen] = React.useState(false);
  const [messages, setMessages] = React.useState([
    { sender: "bot", text: "Hello! How can I help you learn about Reading Connections Inc. today?" }
  ]);
  const [input, setInput] = React.useState("");

  const knowledge = {
    hours: "We are open Monday through Thursday, from 2:00 PM to 6:00 PM.",
    contact: "You can reach us at (920) 544-5115 or rickb@rcinc.org.",
    location: "We are located at 1260 Centennial Centre Blvd, Suite 200, Hobart, WI 54155.",
    services: "We offer private lessons, evaluations, and initial consultations. All lessons are one-on-one and confidential.",
    mission: "Our mission is to help nearly every person learn to read fluently using a method grounded in brain science.",
    method: "Our method uses Multisensory Learning, Sequential Phonics, Cognitive Reinforcement, and Emotional Transformation.",
    pricing: "For pricing information, please contact us at (920) 544-5115."
  };

  function getBotReply(msg) {
    const t = msg.toLowerCase();

    if (t.includes("hour") || t.includes("open")) return knowledge.hours;
    if (t.includes("phone") || t.includes("contact") || t.includes("email")) return knowledge.contact;
    if (t.includes("where") || t.includes("address") || t.includes("location")) return knowledge.location;
    if (t.includes("service") || t.includes("offer")) return knowledge.services;
    if (t.includes("mission")) return knowledge.mission;
    if (t.includes("method") || t.includes("teach") || t.includes("how")) return knowledge.method;
    if (t.includes("price") || t.includes("cost")) return knowledge.pricing;

    return "I'm here to help! You can ask about hours, services, our mission, our method, or how to contact us.";
  }

  function sendMessage() {
    if (!input.trim()) return;

    const userMessage = { sender: "user", text: input };
    setMessages(m => [...m, userMessage]);

    setTimeout(() => {
      const reply = getBotReply(input);
      const botMessage = { sender: "bot", text: reply };
      setMessages(m => [...m, botMessage]);
    }, 500);

    setInput("");
  }

  return (
    <>
      {!open && (
        <button
          onClick={() => setOpen(true)}
          className="fixed bottom-6 right-6 bg-sky-600 text-white p-4 rounded-full shadow-2xl text-xl"
        >
          💬
        </button>
      )}

      {open && (
        <div className="fixed bottom-6 right-6 w-full max-w-sm h-[550px] bg-white rounded-xl shadow-2xl flex flex-col border border-slate-300">

          {/* HEADER */}
         <div className="bg-sky-600 text-white p-4 font-bold flex justify-between items-center">
  <span>Reading Connections Chat</span>

  <button
    onClick={() => setOpen(false)}
    className="bg-white text-sky-600 px-3 py-1 rounded font-bold shadow hover:bg-slate-100"
  >
    ✖ Close
  </button>
</div>


          {/* MESSAGES */}
          <div className="flex-1 p-4 overflow-y-auto bg-slate-50 space-y-4">
            {messages.map((m, i) => (
              <div key={i} className={"flex " + (m.sender === "user" ? "justify-end" : "justify-start")}>
                <div
                  className={
                    "px-4 py-2 rounded-2xl max-w-xs font-semibold " +
                    (m.sender === "user"
                      ? "bg-sky-600 text-white rounded-br-none"
                      : "bg-slate-200 text-slate-900 rounded-bl-none")
                  }
                >
                  {m.text}
                </div>
              </div>
            ))}
          </div>

          {/* INPUT BAR */}
          <div className="p-4 border-t flex gap-2">
            <input
              className="flex-1 border rounded-full px-4 py-2"
              value={input}
              placeholder="Type a message…"
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" ? sendMessage() : null}
            />
            <button
              onClick={sendMessage}
              className="bg-sky-600 text-white rounded-full px-4 py-2"
            >
              Send
            </button>
          </div>

        </div>
      )}
    </>
  );
}
