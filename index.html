function Header() {

      <div>

        <div className="mt-12 grid sm:grid-cols-3 gap-8">

   TESTIMONIALS

  return (

      <h2 className="text-4xl font-extrabold text-slate-800 text-center">What People Are Saying</h2>

/* ============================================================
   CHATBOT (TEXT-ONLY)
============================================================ */
function Chatbot() {
  const [open,setOpen] = React.useState(false);
  const [messages,setMessages] = React.useState([
    {sender:"bot", text:"Hello! How can I help you learn about Reading Connections Inc. today?"}
  ]);
  const [input,setInput] = React.useState("");

  const respond = (msg) => {
    const t = msg.toLowerCase();

    if (t.includes("hour")) return "We are open Monday–Thursday, 2–6 PM.";
    if (t.includes("where") || t.includes("location")) return CONTACT_INFO.address;
    if (t.includes("service")) return "We offer private lessons, consultations, and evaluations.";
    if (t.includes("contact")) return `${CONTACT_INFO.phone} — ${CONTACT_INFO.email}`;
    return "I'm here to help with questions about our services, mission, and hours!";
  };

  const sendMessage = () => {
    if (!input.trim()) return;
    const user = { sender:"user", text:input };
    setMessages(m=>[...m,user]);

    setTimeout(()=>{
      const bot = { sender:"bot", text:respond(input) };
      setMessages(m=>[...m,bot]);
    }, 600);

    setInput("");
  };

  return (
    <>
      {!open && (
        <button
          onClick={()=>setOpen(true)}
          className="fixed bottom-6 right-6 bg-sky-500 text-white p-4 rounded-full shadow-xl"
        >
          Chat
        </button>
      )}

      {open && (
        <div className="fixed bottom-6 right-6 w-full max-w-sm h-[600px] bg-white rounded-xl shadow-2xl flex flex-col">
          <div className="bg-sky-500 text-white p-4 font-bold flex justify-between">
            <span>Reading Connections Chat</span>
            <button onClick={()=>setOpen(false)}>X</button>
          </div>

          <div className="flex-1 p-4 overflow-y-auto bg-slate-50 space-y-4">
            {messages.map((m,i)=>(
              <div key={i} className={"flex "+(m.sender==="user"?"justify-end":"justify-start")}>
                <div className={
                    "px-4 py-2 rounded-2xl max-w-xs font-semibold "+
                    (m.sender==="user"
                      ? "bg-sky-500 text-white rounded-br-none"
                      : "bg-slate-200 text-slate-800 rounded-bl-none")
                  }>
                  {m.text}
                </div>
              </div>
            ))}
          </div>

          <div className="p-4 border-t flex gap-2">
            <input
              value={input}
              onChange={(e)=>setInput(e.target.value)}
              className="flex-1 border rounded-full px-4 py-2"
              placeholder="Type a message..."
            />
            <button onClick={sendMessage} className="bg-sky-500 text-white rounded-full px-4 py-2">
              Send
            </button>
          </div>
        </div>
      )}
    </>
  );
}
