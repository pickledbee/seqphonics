    /* ============================================================
       AUDIO (text-to-speech)
    ============================================================ */
    let selectedVoice = null;

    function loadBestVoice() {
      const voices = window.speechSynthesis.getVoices();
      const priority = [
        "Google US English",
        "Google UK English Female",
        "Microsoft Aria Online (Natural)",
        "Microsoft Jenny Online (Natural)"
      ];

      for (const name of priority) {
        const v = voices.find(voice => voice.name === name);
        if (v) { selectedVoice = v; return; }
      }

      // Fallback
      selectedVoice =
        voices.find(v => v.name.includes("Google")) ||
        voices.find(v => v.name.includes("Natural")) ||
        voices[0] || null;
    }

    window.speechSynthesis.onvoiceschanged = loadBestVoice;

    function speakText(text) {
      if (!text) return;

      // Fun pronunciation override
      text = text.replace(/Reading Connections/gi, "Reee-ding Connections");

      const utter = new SpeechSynthesisUtterance(text);
      if (selectedVoice) utter.voice = selectedVoice;
      utter.pitch = 1;
      utter.rate = 0.88;
      utter.volume = 1;

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utter);
    }

      const clean = text.replace(/Reading Connections/gi, "Reee-ding Connections");

          <button onClick={() => window.speechSynthesis.cancel()}

      );
    }

    /* ============================================================
       CRM INQUIRY FORM (Apps Script Web App Integration)
    ============================================================ */
    function ContactSection({ onShowLegal }) {
      const [formType, setFormType] = React.useState("contact");
      const [formData, setFormData] = React.useState({ parentName: "", email: "", phone: "", grade: "", message: "" });
      const [status, setStatus] = React.useState("idle"); 

      const handleChange = (e) => {
        setFormData({ ...formData, [e.target.name]: e.target.value });
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setStatus("submitting");

        const payload = formType === 'contact' 
          ? formData 
          : { 
              parentName: "Unsubscribe Request", 
              grade: "N/A", 
              phone: "N/A",
              email: formData.email, 
              message: "User requested to UNSUBSCRIBE from mailing list." 
            };

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxT0CNf1gww0jmFtxm1gjuQHUEMYr7aXOr6Hq6X_eHt373GKbu-J665BIz1b2oDdoo4gg/exec";

        try {
          const response = await fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify(payload)
          });
          
          const data = await response.json();
          
          if (data.status === "Success") {
            setStatus("success");
            setFormData({ parentName: "", email: "", phone: "", grade: "", message: "" });
          } else {
            console.error("Backend error:", data.message);
            setStatus("error");
          }
        } catch (error) {
          console.error("Fetch error:", error);
          setStatus("error");
        }
      };

      return (
        <section id="contact-form" className="py-20 bg-sky-50 flex justify-center px-6">
          <div className="w-full max-w-lg bg-white rounded-2xl shadow-xl overflow-hidden">
            
            <div className="bg-black py-8 px-6 text-center flex justify-center items-center">
              <a href="https://ibb.co/Dgbhs9r5" target="_blank" rel="noopener noreferrer">
                <img 
                  src="https://i.ibb.co/PzYK3cDw/RCINC-Logo-WHT-1.png" 
                  alt="Reading Connections Inc. Logo" 
                  className="max-w-[220px] h-auto border-0" 
                />
              </a>
            </div>

            <div className="p-8">
              <h2 className="text-2xl font-bold text-center text-slate-800 mb-6">
                {formType === 'contact' ? "Inquire About Tutoring" : "Unsubscribe"}
              </h2>

              {status === "success" ? (
                <div className="text-center py-6">
                  <p className="text-2xl text-green-600 font-bold">
                    {formType === 'contact' ? "Thank you!" : "Unsubscribe Request Sent"}
                  </p>
                  <p className="text-slate-600 mt-2">
                    {formType === 'contact' 
                      ? "Your inquiry has been sent successfully. Check your email for a confirmation from our team." 
                      : "We have received your request and will remove you from our list."}
                  </p>
                  <button onClick={() => setStatus("idle")} className="mt-6 text-sky-600 font-bold hover:underline">
                    {formType === 'contact' ? "Send another message" : "Back to site"}
                  </button>
                </div>
              ) : (
                <form onSubmit={handleSubmit} className="space-y-4">
                  {formType === 'contact' && (
                    <>
                      <div>
                        <label className="block text-sm font-bold text-slate-700 mb-1">Parent/Guardian Name</label>
                        <input required type="text" name="parentName" value={formData.parentName} onChange={handleChange}
                          className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none text-slate-800" />
                      </div>
                    </>
                  )}

                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">Email Address</label>
                    <input required type="email" name="email" value={formData.email} onChange={handleChange}
                      className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none text-slate-800" />
                  </div>

                  {formType === 'contact' && (
                    <>
                      <div>
                        <label className="block text-sm font-bold text-slate-700 mb-1">Phone Number</label>
                        <input required type="tel" name="phone" value={formData.phone} onChange={handleChange}
                          className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none text-slate-800" />
                      </div>

                      <div>
                        <label className="block text-sm font-bold text-slate-700 mb-1">Student Age / Grade Level</label>
                        <input required type="text" name="grade" value={formData.grade} onChange={handleChange}
                          className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none text-slate-800" />
                      </div>

                      <div>
                        <label className="block text-sm font-bold text-slate-700 mb-1">How can we help?</label>
                        <textarea required name="message" value={formData.message} onChange={handleChange} rows="4"
                          className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none text-slate-800 resize-y"></textarea>
                      </div>
                    </>
                  )}

                  <button disabled={status === "submitting"} type="submit"
                    className="w-full py-3 bg-green-600 text-white text-lg font-bold rounded-lg hover:bg-green-700 transition disabled:opacity-50 mt-2">
                    {status === "submitting" ? "Sending..." : (formType === 'contact' ? "Send Inquiry" : "Unsubscribe")}
                  </button>

                  {formType === 'contact' && (
                    <p className="text-xs text-slate-400 text-center mt-4">
                      By submitting this form, you agree to our <button type="button" onClick={onShowLegal} className="underline hover:text-sky-600 cursor-pointer">Terms of Service & Privacy Policy</button>.
                    </p>
                  )}

                  {status === "error" && <p className="text-red-500 text-center text-sm font-bold mt-2">An error occurred. Please try again or contact us directly.</p>}

                  <div className="mt-4 text-center">
                    {formType === 'contact' ? (
                      <button type="button" onClick={() => { setFormType('unsubscribe'); setStatus('idle'); }} className="text-xs text-slate-400 hover:text-sky-600 underline">

                      <button type="button" onClick={() => { setFormType('contact'); setStatus('idle'); }} className="text-sm text-sky-600 hover:text-sky-800 underline font-bold">
                        &larr; Back to Contact Form
                      </button>
                    )}
                  </div>
                </form>
              )}
            </div>
          </div>
        </section>
      );
    }

                className="bg-slate-800 text-white px-4 py-2 rounded-lg hover:bg-slate-700 font-semibold text-sm flex items-center gap-2">
                <span>🖨️</span> Save as PDF / Print
              </button>
            </div>

            <h1 className="text-4xl font-extrabold mb-8 text-center border-b pb-4">Reading Connections Inc. - Email Subscription Legal Documents</h1>

            <div className="space-y-8 text-sm md:text-base">
              <section>
                <h2 className="text-2xl font-bold mb-4">1. TERMS OF SERVICE FOR EMAIL SUBSCRIPTIONS</h2>
                <p className="font-semibold text-slate-500 mb-4">Last Updated: November 30, 2025</p>
                <h3 className="text-lg font-bold mt-4">1.1 Acceptance of Terms</h3>
                <p>By subscribing to Reading Connections Inc. (RCI) email newsletters, educational content, updates, and communications (collectively, "Services"), you agree to be bound by these Terms of Service.</p>
              </section>
            </div>

            <div className="mt-12 text-center no-print">
               <button onClick={onBack} className="bg-sky-600 text-white px-6 py-3 rounded-lg font-bold shadow hover:bg-sky-700 cursor-pointer">Accept & Return to Site</button>
            </div>

          </div>
        </div>
      );
    }

    /* ============================================================
       CHATBOT
    ============================================================ */
    function Chatbot() {
      const [open, setOpen] = React.useState(false);
      const [messages, setMessages] = React.useState([
        { sender: "bot", text: "Hello! How can I help you learn about Reading Connections today?" }
      ]);
      const [input, setInput] = React.useState("");

      function getBotReply(msg) {
        const t = msg.toLowerCase();
        if (t.includes("hour") || t.includes("open")) return "We are open Monday–Thursday, 2–6 PM.";
        if (t.includes("phone") || t.includes("contact")) return CONTACT.phone;
        if (t.includes("email")) return CONTACT.email;
        if (t.includes("address") || t.includes("where")) return CONTACT.address;
        return "Ask about hours, services, mission, method, or contact info.";
      }

      function sendMessage() {
        if (!input.trim()) return;
        setMessages(m => [...m, { sender: "user", text: input }]);
        setTimeout(() => {
          setMessages(m => [...m, { sender: "bot", text: getBotReply(input) }]);
        }, 500);
        setInput("");
      }

      return (
        <div className="no-print">
          {!open && (
            <button onClick={() => setOpen(true)} className="fixed bottom-6 right-6 bg-sky-600 text-white p-4 rounded-full shadow-2xl text-2xl z-50 hover:scale-105 transition">
              💬
            </button>
          )}

          {open && (
            <div className="fixed bottom-6 right-6 w-full max-w-sm h-96 bg-white rounded-xl shadow-2xl flex flex-col border overflow-hidden z-50">
              <div className="bg-sky-600 text-white p-4 font-bold flex justify-between items-center">
                <span>Reading Connections Chat</span>
                <button onClick={() => setOpen(false)} className="text-white hover:text-slate-200">✕</button>
              </div>
              <div className="flex-1 p-4 overflow-y-auto bg-slate-50 space-y-3">
                {messages.map((m, i) => (
                  <div key={i} className={`flex ${m.sender === "user" ? "justify-end" : "justify-start"}`}>
                    <div className={`px-4 py-2 rounded-lg max-w-[80%] text-sm ${m.sender === "user" ? "bg-sky-600 text-white" : "bg-slate-200 text-slate-800"}`}>
                      {m.text}
                    </div>
                  </div>
                ))}
              </div>
              <div className="p-3 border-t flex gap-2">
                <input className="flex-1 border rounded-full px-4 py-2 text-sm outline-none focus:border-sky-500"
                  value={input} placeholder="Type a message..." onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" ? sendMessage() : null} />
                <button onClick={sendMessage} className="bg-sky-600 text-white rounded-full px-4 py-2 text-sm font-bold">Send</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ============================================================
       AUDIO SUMMARY
    ============================================================ */
    function AudioSummary() {
      const summary = `This is the brief summary of the science-backed reading method from Reading Connections Inc...`;
      return (
        <div className="text-center py-10 bg-white no-print">
          <button onClick={() => speakText(summary)} className="px-6 py-3 bg-slate-100 text-sky-700 font-bold rounded-lg hover:bg-slate-200 transition">
            🔊 Listen to Summary
          </button>
        </div>
      );
    }

    /* ============================================================
       FOOTER
    ============================================================ */
    function Footer({ onShowLegal }) {
      return (
        <footer className="bg-slate-900 text-slate-300 py-16 text-center no-print">
          <h2 className="text-3xl font-extrabold text-white">{CONTACT.name}</h2>
          <div className="mt-6 space-y-2 text-lg">
            <p><a href="tel:9205445115" className="hover:text-white transition">{CONTACT.phone}</a></p>
            <p><a href="mailto:rickb@rcinc.org" className="hover:text-white transition">{CONTACT.email}</a></p>
            <p>{CONTACT.address}</p>
          </div>
          <div className="mt-8 pt-8 border-t border-slate-700 flex flex-col gap-2">
             <p className="text-slate-500 text-sm">© {new Date().getFullYear()} Reading Connections Inc.</p>
             <button onClick={onShowLegal} className="text-slate-500 text-sm hover:text-white underline cursor-pointer">Privacy Policy & Terms of Service</button>
          </div>
        </footer>
      );
    }

    /* ============================================================
       APP ROOT 
    ============================================================ */
    function App() {
      const [page, setPage] = React.useState("home");

      const showLegal = (e) => {
        if(e) e.preventDefault();
        setPage("legal");
        window.scrollTo(0, 0);
      };

      const showHome = (e) => {
        if(e) e.preventDefault();
        setPage("home");
        window.scrollTo(0, 0);
      };

      if (page === "legal") return <LegalPage onBack={showHome} />;

      return (
        <>
          <Header />
          <Hero />
          <Mission />
          <HowItWorks />
          <Method />
          <Services />
          <Testimonials />
          <ContactSection onShowLegal={showLegal} />
          <AudioSummary />
          <Chatbot />
          <Footer onShowLegal={showLegal} />
        </>
      );
    }

    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);

  </script>

  <!-- ============================================================
       SAFE BOOTSTRAP RUNNER
  ============================================================ -->
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        if (window.Babel && window.React && window.ReactDOM) {
          window.Babel.run(document.getElementById('main-app').textContent);
        } else {
          console.error("Critical Dependencies Missing!");
        }
      }, 100);
    });
  </script>
</body>
