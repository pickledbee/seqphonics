<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reading Connections Inc.</title>

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React / ReactDOM -->

<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<!-- Babel for JSX -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  .voice-panel {
    animation: fadeIn 0.2s ease-out;
  }
  @keyframes fadeIn {
    from {opacity: 0; transform: scale(0.95);}
    to {opacity: 1; transform: scale(1);}
  }
</style>

<body class="bg-slate-50">
<div id="root"></div>

<script type="text/babel">

/* ============================================================
   NATURAL SPEECH ENGINE (NO API KEY REQUIRED)
============================================================ */

function useSpeech(text) {
  const synth = window.speechSynthesis;
  const utterance = new SpeechSynthesisUtterance(text);

  // Pick most human-like voice
  let voices = [];
  const loadVoices = () => {
    voices = synth.getVoices();
    const naturalPreferred = voices.find(v =>
      /Samantha|Daniel|Moira|Ava|Zira|Aria|Google US English|Serena|Tom/i.test(v.name)
    );
    utterance.voice = naturalPreferred || voices[0];
  };

  loadVoices();
  if (voices.length === 0) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  utterance.pitch = 1.0;
  utterance.rate = 0.95;

  return {
    play: () => { synth.cancel(); synth.speak(utterance); },
    pause: () => synth.pause(),
    resume: () => synth.resume(),
    stop: () => synth.cancel(),
    setRate: (val) => utterance.rate = val
  };
}

/* ============================================================
   SPEECH CONTROL UI — STYLE 3 (TINY ICON → EXPANDS)
============================================================ */

function SpeechControls({ text }) {
  const [open, setOpen] = React.useState(false);
  const [rate, setRate] = React.useState(0.95);
  const engine = React.useMemo(() => useSpeech(text), [text]);

  const handleRate = (e) => {
    const val = parseFloat(e.target.value);
    setRate(val);
    engine.setRate(val);
  };

  if (!open) {
    return (
      <button
        className="mt-2 text-slate-600 hover:text-slate-800 text-xl"
        onClick={() => setOpen(true)}
        title="Listen to this section"
      >
        🔈
      </button>
    );
  }

  return (
    <div className="voice-panel bg-white p-4 mt-3 rounded-xl shadow border border-slate-200">
      <div className="font-bold text-slate-700 mb-3">Speech Controls</div>

      <div className="flex flex-wrap gap-3">
        <button onClick={engine.play} className="bg-sky-500 text-white px-3 py-1 rounded">Play</button>
        <button onClick={engine.pause} className="bg-yellow-500 text-white px-3 py-1 rounded">Pause</button>
        <button onClick={engine.resume} className="bg-green-500 text-white px-3 py-1 rounded">Resume</button>
        <button onClick={engine.stop} className="bg-red-500 text-white px-3 py-1 rounded">Stop</button>
      </div>

      <div className="mt-4">
        <label className="font-semibold text-sm text-slate-700">Speed: {rate.toFixed(2)}</label>
        <input
          type="range"
          min="0.6"
          max="1.4"
          step="0.05"
          value={rate}
          onChange={handleRate}
          className="w-full mt-1"
        />
      </div>

      <button
        onClick={() => setOpen(false)}
        className="mt-3 text-red-500 font-bold underline"
      >
        Close
      </button>
    </div>
  );
}

  { name: "Testimonials", href: "#testimonials" },

/* ============================================================
   CHATBOT
============================================================ */

function Chatbot() {
  const [open,setOpen] = React.useState(false);
  const [messages,setMessages] = React.useState([
    {sender:"bot", text:"Hello! How can I help you today?"}
  ]);
  const [input,setInput] = React.useState("");

  const respond = (msg) => {
    const t = msg.toLowerCase();

    if (t.includes("hour")) return "We are open Monday–Thursday, 2–6 PM.";
    if (t.includes("where") || t.includes("location")) return CONTACT_INFO.address;
    if (t.includes("service")) return "We offer private lessons, evaluations, and consultations.";
    if (t.includes("contact")) return `${CONTACT_INFO.phone} — ${CONTACT_INFO.email}`;
    return "I'm here to help with questions about Reading Connections Inc!";
  };

  const sendMessage = () => {
    if (!input.trim()) return;
    const user = { sender:"user", text:input };
    setMessages(m=>[...m,user]);

    setTimeout(()=>{
      const bot = { sender:"bot", text:respond(input) };
      setMessages(m=>[...m,bot]);
    }, 500);

    setInput("");
  };

  return (
    <>
      {!open && (
        <button
          onClick={()=>setOpen(true)}
          className="fixed bottom-6 right-6 bg-sky-500 text-white p-4 rounded-full shadow-xl"
        >
          Chat
        </button>
      )}

      {open && (
        <div className="fixed bottom-6 right-6 w-full max-w-sm h-[600px] bg-white rounded-xl shadow-2xl flex flex-col">
          
          <div className="bg-sky-500 text-white p-4 font-bold flex justify-between">
            <span>Reading Connections Chat</span>
            <button onClick={()=>setOpen(false)}>X</button>
          </div>

          <div className="flex-1 p-4 overflow-y-auto bg-slate-50 space-y-4">
            {messages.map((m,i)=>(
              <div key={i} className={"flex "+(m.sender==="user"?"justify-end":"justify-start")}>
                <div className={
                  "px-4 py-2 rounded-2xl max-w-xs font-semibold "+
                  (m.sender==="user"?"bg-sky-500 text-white rounded-br-none":"bg-slate-200 text-slate-800 rounded-bl-none")
                }>
                  {m.text}
                </div>
              </div>
            ))}
          </div>

          <div className="p-4 border-t flex gap-2">
            <input
              value={input}
              onChange={e=>setInput(e.target.value)}
              className="flex-1 border rounded-full px-4 py-2"
              placeholder="Type a message..."
            />
            <button onClick={sendMessage} className="bg-sky-500 text-white rounded-full px-4 py-2">
              Send
            </button>
          </div>

          <button
            onClick={()=>setOpen(false)}
            className="w-full bg-red-500 text-white py-3 font-bold rounded-b-xl hover:bg-red-600"
          >
            Close Chat
          </button>

        </div>
      )}
    </>
  );
}

</script>
